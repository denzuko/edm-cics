# EDM transactions.conf
# Format: TRANSID:LANG:PROGRAM[:GROUPS[:DATABASE]]
# All EDM SQL transactions bind to the edm database (5th field).
# Non-SQL transactions omit the 5th field and use the default bricks db.

# Episode 01 — first transaction, COBOL
EMHL:cobol:edmhelo.cob:PUBLIC

# Episode 02 — REXX twin
EMHI:rexx:edmhelo.rexx:PUBLIC

# Episode 03 — EDMMST inquiry (KSDS read)
EMMI:cobol:emmi.cob:PUBLIC,USERS,ADMIN

# Episode 04 — EDMMST write
EMMW:cobol:emmw.cob:PUBLIC,USERS,ADMIN

# Episode 05 — SQL bridge, SELECT INTO
EMSI:cobol:emsi.cob:PUBLIC,USERS,ADMIN:edm

# Episode 06 — EDMORD order entry
EMOR:cobol:emor.cob:PUBLIC,USERS,ADMIN:edm

# Episode 07 — EXEC CICS LINK demo
EMLI:rexx:emli.rexx:PUBLIC,USERS,ADMIN:edm

# Episode 08 — EDMSEC Annoyance Rank
EMSC:cobol:emsc.cob:USERS,ADMIN:edm

# Episode 09 — EDMARC audit log append
EMARC:rexx:emarc.rexx:USERS,ADMIN:edm

# Episode 10 — EDMRPT reporting
EMRP:cobol:emrp.cob:PUBLIC,USERS,ADMIN:edm
